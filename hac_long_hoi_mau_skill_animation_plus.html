const rarityById={
 sweep:'THƯỜNG',fire:'THƯỜNG',lightning:'THƯỜNG',vertical:'THƯỜNG',ice:'THƯỜNG',wind:'THƯỜNG',earth:'THƯỜNG',poison:'THƯỜNG',water:'THƯỜNG',blade:'THƯỜNG',crystal:'THƯỜNG',moon:'THƯỜNG',
 meteor:'HIẾM',shadow:'HIẾM',holy:'HIẾM',blood:'HIẾM',laser:'HIẾM',vampire:'HIẾM',teleport:'HIẾM',spear:'HIẾM',frostblade:'HIẾM',flameblade:'HIẾM',
 healer:'HIẾM',thunder:'SỬ THI',dragon:'SỬ THI',gravity:'SỬ THI',bomb:'SỬ THI',phantom:'SỬ THI',star:'SỬ THI',bloodmoon:'SỬ THI',
 berserk:'SỬ THI',knockback:'HIẾM',sun:'HUYỀN THOẠI',vortex:'HUYỀN THOẠI',meteorblade:'HUYỀN THOẠI',phoenix:'HUYỀN THOẠI',void:'HUYỀN THOẠI',dragonstorm:'HUYỀN THOẠI',time:'TỐI THƯỢNG'
};
const rarityInfo={
 'THƯỜNG':{total:45},'HIẾM':{total:30},'SỬ THI':{total:15},'HUYỀN THOẠI':{total:9.9},'TỐI THƯỢNG':{total:.1}
};
for(const cl of classes)cl.rarity=cl.rarity||rarityById[cl.id]||'THƯỜNG';
function classChance(cl){let n=classes.filter(x=>x.rarity===cl.rarity).length;return rarityInfo[cl.rarity].total/n;}
function rarityColor(r){return r==='TỐI THƯỢNG'?'#ff4cff':r==='HUYỀN THOẠI'?'#ff9f43':r==='SỬ THI'?'#d38cff':r==='HIẾM'?'#65c8ff':'#b8b8b8';}
function pickRandomClass(){let r=Math.random()*100,acc=0;for(const [name,info] of Object.entries(rarityInfo)){acc+=info.total;if(r<=acc){let a=classes.filter(c=>c.rarity===name);return a[Math.floor(Math.random()*a.length)];}}return classes[0];}
function saveGame(){try{localStorage.setItem('hacLongSave',JSON.stringify({rankPoints,coinCount,ownedClassIds,selectedClassId:selectedClass?selectedClass.id:null}));}catch(e){}}
function loadGame(){try{let raw=localStorage.getItem('hacLongSave');if(raw){let data=JSON.parse(raw);rankPoints=Number(data.rankPoints)||0;coinCount=Number(data.coinCount)||0;ownedClassIds=Array.isArray(data.ownedClassIds)?data.ownedClassIds:[];selectedClass=classes.find(c=>c.id===data.selectedClassId)||null;}else{ownedClassIds=[];selectedClass=null;}const rarest=classes.find(c=>c.id==='time');if(rarest){if(!ownedClassIds.includes('time'))ownedClassIds.push('time');selectedClass=rarest;}saveLoaded=true;saveGame();}catch(e){}}
function addRankFromDeath(){let gained=wave*10;lastRankGain=gained;rankPoints+=gained;saveGame();return gained;}
function rankInfo(){const tiers=['ĐỒNG 3','ĐỒNG 2','ĐỒNG 1','BẠC 3','BẠC 2','BẠC 1','VÀNG 3','VÀNG 2','VÀNG 1','BẠCH KIM 3','BẠCH KIM 2','BẠCH KIM 1','KIM CƯƠNG 3','KIM CƯƠNG 2','KIM CƯƠNG 1'];let pts=Math.max(0,rankPoints);if(pts<1500){let i=Math.min(14,Math.floor(pts/100));return {name:tiers[i],progress:pts-i*100,stars:0,next:100};}let stars=Math.floor((pts-1500)/100);if(stars<25)return {name:'HUYỀN THOẠI',progress:stars,stars,next:25};if(stars<100)return {name:'SIÊU HUYỀN THOẠI',progress:stars-25,stars:stars-25,next:75};if(stars<200)return {name:'CAO THỦ',progress:stars-100,stars:stars-100,next:100};if(stars<350)return {name:'ĐẠI CAO THỦ',progress:stars-200,stars:stars-200,next:150};return {name:'THÁCH ĐẤU',progress:0,stars:stars-350,next:null};}
const btns=[
{id:'atk',x:635,y:300,r:43,t:'⚔️'},
{id:'dodge',x:535,y:350,r:36,t:'💨'},
{id:'skill',x:630,y:380,r:36,t:'✨'},
{id:'heal',x:535,y:275,r:36,t:'❤️'}
];
function resetGame(){p={x:360,y:215,r:17,hp:200,max:200,spd:2.8,faceX:1,faceY:0,damageBuff:0,shield:0,timeBuff:0};enemies=[];coins=[];effects=[];particles=[];score=0;wave=1;dead=false;started=false;classMenu=false;rolling=false;attackCD=dodgeCD=skillCD=healCD=0;rollMsg='';screenShake=0;loadGame();}
function spawn(){
 enemies=[];
 const count=3+Math.min(wave+1,10);
 const hpScale=Math.pow(1.16,wave-1);
 for(let i=0;i<count;i++){let side=Math.floor(Math.random()*4);let ex=side<2?(side?W-25:25):Math.random()*W;let ey=side<2?Math.random()*H:(side===2?25:H-25);let hp=Math.round((42+wave*11)*hpScale);let elite=wave>=4&&Math.random()<Math.min(.45,.08+wave*.018);if(elite)hp=Math.round(hp*1.7);enemies.push({x:ex,y:ey,r:elite?17:14,hp,max:hp,spd:(.68+wave*.045)*(elite?1.12:1),cd:Math.random()*500,frozen:0,boss:false,elite});}
 let side=Math.floor(Math.random()*4),bx=side<2?(side?W-65:65):Math.random()*W,by=side<2?Math.random()*H:(side===2?65:H-65);
 let bhp=Math.round((320+wave*150+wave*wave*42)*Math.pow(1.10,Math.max(0,wave-1))), bs=.52+wave*.028;
 enemies.push({x:bx,y:by,r:32,hp:bhp,max:bhp,spd:bs,cd:Math.random()*500,frozen:0,boss:true,bossName:'BOSS MÀN '+wave,bossSkillCD:2600+Math.random()*1000,bossPhase:0,bossSkill:Math.min(wave-1,9)});
 const bossSkillNames=['SÓNG XUNG KÍCH','TIA LỬA','LAO HỦY DIỆT','TRIỆU HỒI QUÂN','MƯA THIÊN THẠCH','VÒNG KIẾM','TIA NĂNG LƯỢNG','QUẢ CẦU TRUY ĐUỔI','DỊCH CHUYỂN ĐÁNH ÚP','CUỒNG PHONG SẤM SÉT'];
 effects.push({type:'bossintro',x:bx,y:by,life:1000,maxLife:1000,bossSkillName:bossSkillNames[Math.min(wave-1,9)]});
}

function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function dropCoins(e){let n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)coins.push({x:e.x+(Math.random()-.5)*24,y:e.y+(Math.random()-.5)*24,r:8,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5});}
function killCheck(){let alive=[];for(const e of enemies){if(e.hp<=0){score++;dropCoins(e);effects.push({type:'coinburst',x:e.x,y:e.y,life:450});}else alive.push(e)}enemies=alive;if(enemies.length===0){wave++;p.hp=p.max;effects.push({type:'megaheal',x:p.x,y:p.y,life:1100,maxLife:1100,range:155});burst(p.x,p.y,'#6dff9a',65,8);screenShake=3;spawn();}}
function hurt(n){if(dead)return;if(p.shield>0){let block=Math.min(p.shield,n);p.shield-=block;n-=block;effects.push({type:'shieldhit',x:p.x,y:p.y,life:300,maxLife:300});if(n<=0)return}p.hp=Math.max(0,p.hp-n);if(p.hp<=0){dead=true;addRankFromDeath();saveGame();}}
function attack(){if(!started||dead||classMenu||attackCD>0)return;attackCD=300;let range=selectedClass?Math.min(145,selectedClass.range*.58):110;let dmg=selectedClass?Math.round(24+selectedClass.dmg*.18):28;if(p.damageBuff>0)dmg=Math.round(dmg*1.65);if(p.timeBuff>0)dmg=Math.round(dmg*3);for(const e of enemies){let dx=e.x-p.x,dy=e.y-p.y,dd=Math.hypot(dx,dy)||1,dot=(dx/dd)*p.faceX+(dy/dd)*p.faceY;if(dd<range&&dot>.02)e.hp-=dmg}effects.push({type:'slash',x:p.x,y:p.y,life:260,maxLife:260,dir:Math.atan2(p.faceY,p.faceX),range});killCheck();}
function heal(){if(!started||dead||classMenu||healCD>0||p.hp>=p.max)return;p.hp=Math.min(p.max,p.hp+30);healCD=8000;}
function dodge(){if(!started||dead||classMenu||dodgeCD>0)return;dodgeCD=1200;let dx=j.x||p.faceX,dy=j.y||p.faceY,l=Math.hypot(dx,dy)||1;p.x+=dx/l*65;p.y+=dy/l*65;p.x=Math.max(22,Math.min(W-22,p.x));p.y=Math.max(22,Math.min(H-22,p.y));}
function burst(x,y,color,count=18,power=3){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=.5+Math.random()*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:280+Math.random()*360,maxLife:640,size:2+Math.random()*4,color});}}
function hitSparks(x,y,color='#fff'){burst(x,y,color,8,4);effects.push({type:'impact',x,y,life:260,maxLife:260,color});}
function skill(){
 if(!started||dead||classMenu||rolling||!selectedClass||skillCD>0)return;
 skillCD=selectedClass.cd;let id=selectedClass.id,a=Math.atan2(p.faceY,p.faceX),range=selectedClass.range,dmg=selectedClass.dmg;
 burst(p.x,p.y,'#fff',34,6);effects.push({type:'flash',x:p.x,y:p.y,life:220,maxLife:220});screenShake=Math.max(screenShake,6);
 if(id==='time'){for(const e of enemies)e.frozen=3000;p.timeBuff=3000;effects.push({type:'time',x:p.x,y:p.y,life:3000,maxLife:3000});burst(p.x,p.y,'#c58cff',45,6);}
 else if(id==='healer'){
  p.hp=Math.min(p.max,p.hp+55);p.shield=Math.min(45,p.shield+25);effects.push({type:'megaheal',x:p.x,y:p.y,life:1000,maxLife:1000,range:145});burst(p.x,p.y,'#6dff9a',55,7);screenShake=4;
 } else if(id==='berserk'){
  p.damageBuff=6000;effects.push({type:'berserk',x:p.x,y:p.y,life:6000,maxLife:6000,range:85});burst(p.x,p.y,'#ff5a2b',50,7);screenShake=7;
 } else if(id==='knockback'){
  effects.push({type:'knockback',x:p.x,y:p.y,life:700,maxLife:700,range,dir:a});
  burst(p.x+p.faceX*35,p.y+p.faceY*35,'#b8f3ff',42,8);screenShake=8;
  for(const e of enemies){let dx=e.x-p.x,dy=e.y-p.y,dd=Math.hypot(dx,dy)||1,dot=(dx/dd)*p.faceX+(dy/dd)*p.faceY;if(dd<range&&dot>.0){e.hp-=dmg;let push=95*(1-dd/range)+35;e.x+=dx/dd*push;e.y+=dy/dd*push;e.x=Math.max(e.r+5,Math.min(W-e.r-5,e.x));e.y=Math.max(e.r+5,Math.min(H-e.r-5,e.y));hitSparks(e.x,e.y,'#b8f3ff');}}
 } else if(['fire','dragon','laser','water','spear','flameblade','frostblade','thunderblade'].includes(id)){
  effects.push({type:id,x:p.x,y:p.y,dir:a,life:850,maxLife:850,range});
  burst(p.x+p.faceX*35,p.y+p.faceY*35,id==='water'?'#49bfff':id==='laser'?'#ff4040':id==='frostblade'?'#74d7ff':'#ff9a3c',28,4);
  for(const e of enemies){let dx=e.x-p.x,dy=e.y-p.y,dd=Math.hypot(dx,dy)||1,dot=(dx/dd)*p.faceX+(dy/dd)*p.faceY;if(dd<range&&dot>.05){e.hp-=dmg;hitSparks(e.x,e.y,id==='water'?'#49bfff':'#fff')}}
 }
 else if(['shadow','teleport','phantom'].includes(id)){
  let ox=p.x,oy=p.y;p.x=Math.max(22,Math.min(W-22,p.x+p.faceX*90));p.y=Math.max(22,Math.min(H-22,p.y+p.faceY*90));effects.push({type:'dash',x:ox,y:oy,x2:p.x,y2:p.y,life:420,maxLife:420});burst(ox,oy,'#9b5cff',25,5);burst(p.x,p.y,'#d7b3ff',25,5);
  for(const e of enemies)if(d(p,e)<range){e.hp-=dmg;hitSparks(e.x,e.y,'#b56cff')}
 }
 else if(['gravity','vortex'].includes(id)){
  for(const e of enemies)if(d(p,e)<range){e.hp-=dmg;e.x+=(p.x-e.x)*.3;e.y+=(p.y-e.y)*.3;hitSparks(e.x,e.y,'#c58cff')}
  effects.push({type:'gravity',x:p.x,y:p.y,life:1100,maxLife:1100,range});burst(p.x,p.y,'#b68cff',42,5);
 }
 else {
  for(const e of enemies)if(d(p,e)<range){e.hp-=dmg;hitSparks(e.x,e.y,id==='poison'?'#8cff4d':id==='ice'?'#74d7ff':'#ff7a3d')}
  effects.push({type:id,x:p.x,y:p.y,life:1300,maxLife:1300,range,dir:a});
  const col={sweep:'#fff',poison:'#8cff4d',ice:'#74d7ff',meteor:'#ff8a3d',wind:'#b8f3ff',earth:'#a87545',holy:'#fff5a3',blood:'#e52d4f',bomb:'#ff6b35',crystal:'#b7e7ff',moon:'#bda7ff',sun:'#ffd84d',blade:'#dce8ff',vampire:'#b72cff',teleport:'#8d5cff',star:'#ffe98a',void:'#7c3cff',flameblade:'#ff7a28',frostblade:'#7de8ff',thunderblade:'#d8f7ff',bloodmoon:'#e62f64',phoenix:'#ff9b32',dragonstorm:'#72d8ff',berserk:'#ff5a2b',healer:'#6dff9a'}[id]||'#ff7a3d';
  burst(p.x+p.faceX*30,p.y+p.faceY*30,col,30,5);
 }
 if(['blood','vampire','bloodmoon','phoenix'].includes(id)){p.hp=Math.min(p.max,p.hp+30);effects.push({type:'healburst',x:p.x,y:p.y,life:700,maxLife:700});burst(p.x,p.y,'#ff4055',30,3)}
 if(id==='phoenix'){p.hp=Math.min(p.max,p.hp+20);effects.push({type:'phoenix',x:p.x,y:p.y,life:1200,maxLife:1200});burst(p.x,p.y,'#ffb347',45,6)}

if(q.x>30&&q.x<190&&q.y>380){classMenu=false;selectedRarity=null;return}return}
if(!started){if(q.x>235&&q.x<485&&q.y>220&&q.y<272){classMenu=true;return}if(q.x>235&&q.x<485&&q.y>290&&q.y<350){started=true;enemies=[];wave=Math.max(1,wave);spawn();return}return}
if(dead){if(q.x>245&&q.x<475&&q.y>270&&q.y<330){p={x:360,y:215,r:17,hp:200,max:200,spd:2.8,faceX:1,faceY:0,damageBuff:0,shield:0,timeBuff:0};enemies=[];coins=[];effects=[];particles=[];score=0;wave=1;dead=false;started=false;classMenu=false;rolling=false;attackCD=dodgeCD=skillCD=healCD=0;loadGame()}return}
if(!started && q.x>575&&q.x<702&&q.y<60){classMenu=true;return}
for(const b of btns)if(Math.hypot(q.x-b.x,q.y-b.y)<b.r){if(b.id==='atk')attack();else if(b.id==='heal')heal();else if(b.id==='dodge')dodge();else skill();return}
if(q.x<260&&q.y>H-190){j.active=true;j.id=id;j.x=(q.x-130)/100;j.y=(q.y-(H-95))/100;let l=Math.hypot(j.x,j.y);if(l>1){j.x/=l;j.y/=l}try{c.setPointerCapture(id)}catch(_){} }
}
function rollClass(){if(coinCount<ROLL_COST||started||rolling)return;coinCount-=ROLL_COST;rolling=true;let n=0;let timer=setInterval(()=>{selectedClass=pickRandomClass();n++;if(n>=12){clearInterval(timer);rolling=false;rollMsg='Đã nhận '+selectedClass.name;rollTimer=1600;if(!ownedClassIds.includes(selectedClass.id))ownedClassIds.push(selectedClass.id);saveGame();}},70);saveGame();}
c.addEventListener('pointerdown',e=>{const q=pos(e);clickAt(q,e.pointerId)});
c.addEventListener('pointermove',e=>{if(!j.active||e.pointerId!==j.id)return;const q=pos(e);j.x=(q.x-130)/100;j.y=(q.y-(H-95))/100;let l=Math.hypot(j.x,j.y);if(l>1){j.x/=l;j.y/=l}});
function stopJoy(e){if(e.pointerId!==j.id)return;j.active=false;j.id=null;j.x=j.y=0}
c.addEventListener('pointerup',stopJoy);c.addEventListener('pointercancel',stopJoy);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')attack();if(e.key.toLowerCase()==='h')heal();if(e.key==='Shift')dodge();if(e.key.toLowerCase()==='e')skill();if(e.key.toLowerCase()==='c' && !started && !dead)classMenu=!classMenu});
addEventListener('keyup',e=>keys[e.key]=false);
function loop(now){let dt=Math.min(40,now-lastTime);lastTime=now;update(dt);if(rollTimer>0)rollTimer-=dt;draw();requestAnimationFrame(loop)}
resetGame();requestAnimationFrame(loop);
</script></body></html>
